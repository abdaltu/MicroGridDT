#USAGE:
#Change upsc's command parameters for your setting in following format: upsname@nuthost. Like: ups@localhost
#If you want montitor more than one ups, copy the configure section form #UPS CONF BEGIN tag to #UPS CONF END tag and set the upsc's parameters.

#UPS CONF BEGIN
UserParameter=ups.BatteryCharge,upsc sako@localhost battery.charge > /dev/stdout 2> /dev/null
UserParameter=ups.BatteryChargeCurrent,upsc sako@localhost battery.charge.current > /dev/stdout 2> /dev/null
UserParameter=ups.BatteryDischargeCurrent,upsc sako@localhost battery.discharge.current > /dev/stdout 2> /dev/null
UserParameter=ups.BatteryVoltage,upsc sako@localhost battery.voltage > /dev/stdout 2> /dev/null
UserParameter=ups.BatteryVoltageSCC,upsc sako@localhost battery.voltage.scc > /dev/stdout 2> /dev/null
UserParameter=ups.BatteryVoltOfToFans,upsc sako@localhost battery.voltoffsetfans > /dev/stdout 2> /dev/null
UserParameter=ups.InputVoltage,upsc sako@localhost input.voltage > /dev/stdout 2> /dev/null
UserParameter=ups.InputFrequency,upsc sako@localhost output.frequency > /dev/stdout 2> /dev/null
UserParameter=ups.OutputVoltage,upsc sako@localhost output.voltage > /dev/stdout 2> /dev/null
UserParameter=ups.OutputPowerVa,upsc sako@localhost output.power.va > /dev/stdout 2> /dev/null
UserParameter=ups.OutputPowerW,upsc sako@localhost output.power.w > /dev/stdout 2> /dev/null
UserParameter=ups.PvInputCurrent,upsc sako@localhost pv.input.current > /dev/stdout 2> /dev/null
UserParameter=ups.PvInputVoltage,upsc sako@localhost pv.input.voltage > /dev/stdout 2> /dev/null
UserParameter=ups.PvChargerPower,upsc sako@localhost pv.charger.power > /dev/stdout 2> /dev/null
UserParameter=ups.UpsLoad,upsc sako@localhost ups.load > /dev/stdout 2> /dev/null
UserParameter=ups.Temperature,upsc sako@localhost device.temperature > /dev/stdout 2> /dev/null
UserParameter=ups.UpsStatus,upsc sako@localhost ups.status > /dev/stdout 2> /dev/null | sed 's/OL/ONLINE/g; s/OB/ON BATTERY/g;'
UserParameter=ups.UpsAlarm,upsc sako@localhost ups.alarm > /dev/stdout 2> /dev/null | sed 's/OL/ONLINE/g; s/OB/ON BATTERY/g;'
UserParameter=ups.UpsInvStatus,upsc sako@localhost device.inv.satus > /dev/stdout 2> /dev/null | sed 's/OL/ONLINE/g; s/OB/ON BATTERY/g;'
#UserParameter=ups.ACrelay,/usr/bin/usbrelay  > /dev/stdout 2> /dev/null | awk -F'=' 'NR==1{print $2}'
UserParameter=ups.ACrelay,cat /tmp/ACrelay.txt
#UPS CONF END
